<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="card">
    <h1>Willkommen zurück</h1>
    <p class="subtitle">Bitte melde dich mit deinem Benutzernamen und Passwort an.</p>

    <form id="userForm" class="form-grid">
        <div>
            <label for="username">Name</label>
            <input type="text" id="username" required>
        </div>
        <div>
            <label for="pass">Passwort</label>
            <input type="password" id="pass" required>
        </div>

        <div class="btn-row">
            <button class="btn-primary" type="submit">Login</button>
            <button class="btn-secondary" type="button" onclick="laden()">Load</button>
        </div>
        <span id="login_message" class="message" aria-live="polite"></span>
    </form>
</main>

<script>
    function laden() {
        const info = document.getElementById("login_message");
        info.innerText = "Daten werden vorbereitet …";
    }

    document.getElementById("userForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const user_name = document.getElementById("username").value;
        const password = document.getElementById("pass").value;

        const user = {user_name, password};

        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(user)
            });

            const data = await response.json();
            if (data.success) {
                window.location.href = "/success.html";
            } else {
                const errMsg = document.getElementById("login_message");
                errMsg.innerText = "Fehler beim Login";
            }
        } catch (e) {
            console.error(e);
            document.getElementById("login_message").innerText = "Verbindungsfehler. Bitte später erneut versuchen.";
        }
    });
</script>
</body>
</html>
